[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swingtrading"
version = "0.1.0"
description = "Overnight S&P 500 swing playbook with quant screening and optional Grok overlay."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "yfinance>=0.2.40",
    "xai-sdk>=1.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pyarrow>=14",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "ib_insync>=0.9.86",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
swingtrading = "swingtrading.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
